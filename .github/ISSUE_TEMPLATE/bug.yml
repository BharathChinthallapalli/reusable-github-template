name: Bug report
description: Report a reproducible failure.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, use the private reporting route in SECURITY.md. Remove secrets and personal data from examples.'
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include minimal steps, prerequisites and synthetic input. State whether it happens every time.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Client, runtime and environment
      description: Give relevant versions; include the editor and extension for AI assistance problems. Say unknown if unavailable.
      placeholder: 'Operating system, runtime version, browser or editor/extension version'
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Application version or commit SHA
      description: Identify the revision that failed, rather than only the current branch name. Say unknown if unavailable.
    validations:
      required: true
  - type: input
    id: execution
    attributes:
      label: CI run, attempt and event, if applicable
      placeholder: 'Run URL, attempt number, pull_request / push / merge_group'
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Include the first relevant error and enough surrounding context to understand it. Remove tokens, cookies, connection strings and personal data; do not upload complete environment dumps.
