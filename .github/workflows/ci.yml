name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Install repository validation dependencies
        run: |
          uv --version
          uv pip install --system --python python -r requirements-dev.txt
      - name: Install pinned secret scanner
        run: python tools/install_hook_tools.py
      - name: Check agent design documents and bound implementation
        run: python tools/check_design.py
      - name: Run Ruff and Gitleaks checks
        run: python hooks/agent_hooks.py --event check
      - name: Check tracked files with the Git hook configuration
        run: python -m pre_commit run --all-files
      - name: Check repository foundation
        run: python tools/check_repository.py
      - name: Check agent and skill configuration
        run: python tools/check_ai_configuration.py
      - name: Check AI catalog freshness
        run: python tools/ai_catalog.py
      - name: Test repository tools
        run: python -m unittest discover -s tests -v
      - name: Test Git and agent hook integration
        env:
          REQUIRE_AGENT_HOOK_TOOLS: '1'
        run: python -m unittest discover -s tests/integration -v

  windows-bootstrap:
    name: Windows hook bootstrap
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Exercise configured Windows launcher and fail-closed recovery
        run: python -m unittest discover -s tests -p test_hook_bootstrap.py -v

  guardian:
    name: Guardian fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Install prepared parser and signature dependencies
        run: |
          uv pip install --system --python python --only-binary :all: -r .guardian/requirements.txt
      - name: Evaluate inert policy and protocol fixtures
        run: python -m unittest discover -s tests/guardian -v
