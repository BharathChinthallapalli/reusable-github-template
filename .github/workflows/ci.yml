name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check tracked files with the Git hook configuration
        run: python -m pre_commit run --all-files
      - name: Check repository foundation
        run: python tools/check_repository.py
      - name: Check agent and skill configuration
        run: python tools/check_ai_configuration.py
      - name: Check AI catalog freshness
        run: python tools/ai_catalog.py
      - name: Test repository tools
        run: python -m unittest discover -s tests -v
      - name: Test Git hook integration
        run: python -m unittest discover -s tests/integration -v
