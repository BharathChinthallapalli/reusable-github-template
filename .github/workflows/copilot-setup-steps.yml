name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - tools/install_hook_tools.py
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - tools/install_hook_tools.py

permissions:
  contents: read

jobs:
  # Copilot discovers this exact job ID on the default branch.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install agent search and JSON tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep fd-find fzf jq
      - name: Verify noninteractive agent tools
        env:
          FZF_DEFAULT_OPTS: ''
          FZF_DEFAULT_OPTS_FILE: ''
        run: |
          set -euo pipefail
          rg --version
          fdfind --version
          fzf --version
          jq --version
          rg -q -F -- 'template_version' template.json
          fdfind --quiet --hidden --type f --glob 'copilot-setup-steps.yml' .github
          printf 'alpha\0beta with space\0' | fzf --read0 --print0 --filter='beta' | python -c 'import sys; assert sys.stdin.buffer.read() == b"beta with space\0"'
          jq -e '.schema_version == 1 and (.template_version | type == "string")' template.json
      - name: Install pinned secret scanner
        run: python tools/install_hook_tools.py
      - name: Confirm validation tools are available
        run: |
          python -m pre_commit --version
          python tools/check_ai_configuration.py --help
          python -I -m ruff --version
          python hooks/agent_hooks.py --event session
