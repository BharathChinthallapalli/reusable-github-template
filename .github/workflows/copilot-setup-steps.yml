name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt

permissions:
  contents: read

jobs:
  # Copilot discovers this exact job ID on the default branch.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Confirm validation tools are available
        run: |
          python -m pre_commit --version
          python tools/check_ai_configuration.py --help
